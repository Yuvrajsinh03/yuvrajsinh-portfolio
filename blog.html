<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Writing — Yuvrajsinh Jadeja</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    :root{
      --bg:#F5F0E8;--bg2:#EDE8DC;--bg3:#E3DDD0;
      --ink:#1A1208;--ink2:#3D3629;--muted:#8A7E6E;
      --accent:#D94F1E;--border:rgba(26,18,8,.10);
      --f-display:'Cormorant Garamond',Georgia,serif;
      --f-body:'DM Sans',system-ui,sans-serif;
      --ease:cubic-bezier(0.16,1,0.3,1);
    }
    html{scroll-behavior:smooth;}
    body{background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.6;overflow-x:hidden;}
    a{color:inherit;text-decoration:none;}
    img{display:block;max-width:100%;}

    /* NAV */
    nav{position:fixed;top:0;left:0;right:0;z-index:200;padding:18px 56px;display:flex;justify-content:space-between;align-items:center;background:rgba(245,240,232,.92);backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid var(--border);}
    .nav-logo{font-family:var(--f-display);font-size:18px;font-weight:600;letter-spacing:-.01em;}
    .nav-back{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);transition:color .2s,gap .2s var(--ease);}
    .nav-back:hover{color:var(--accent);gap:14px;}
    .nav-back::before{content:'←';}

    /* LOADER */
    #loader{position:fixed;inset:0;background:var(--ink);z-index:9999;display:flex;align-items:center;justify-content:center;transition:opacity .6s var(--ease);}
    #loader.hidden{opacity:0;pointer-events:none;}
    .loader-text{font-family:var(--f-display);font-size:clamp(32px,6vw,72px);font-weight:300;font-style:italic;color:var(--bg);letter-spacing:-.04em;}

    /* ERROR */
    #error-state{display:none;padding:160px 56px;text-align:center;}
    #error-state h2{font-family:var(--f-display);font-size:48px;font-weight:300;margin-bottom:16px;}
    #error-state p{color:var(--muted);margin-bottom:32px;}
    .btn-back{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border:1.5px solid var(--ink);border-radius:100px;font-size:12px;font-weight:600;letter-spacing:.07em;transition:background .2s,color .2s,border-color .2s;}
    .btn-back:hover{background:var(--accent);border-color:var(--accent);color:#fff;}

    /* HERO */
    .blog-hero{padding:140px 56px 80px;border-bottom:1px solid var(--border);}
    .blog-type{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:20px;display:flex;align-items:center;gap:10px;}
    .blog-type::before{content:'';display:block;width:18px;height:1px;background:var(--accent);}
    .blog-title{font-family:var(--f-display);font-size:clamp(40px,6vw,88px);font-weight:300;line-height:.96;letter-spacing:-.04em;max-width:880px;margin-bottom:36px;}
    .blog-meta{display:flex;gap:32px;align-items:center;flex-wrap:wrap;}
    .blog-meta-item{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.04em;}
    .blog-meta-sep{width:3px;height:3px;border-radius:50%;background:var(--muted);}

    /* COVER IMAGE */
    .blog-cover{height:clamp(280px,50vw,560px);overflow:hidden;background:var(--bg2);}
    .blog-cover img{width:100%;height:100%;object-fit:cover;filter:saturate(.85);}

    /* BODY */
    .blog-body{padding:80px 56px;max-width:760px;margin:0 auto;}
    .blog-excerpt{font-family:var(--f-display);font-size:clamp(20px,2.4vw,30px);font-weight:300;line-height:1.4;letter-spacing:-.02em;color:var(--ink2);margin-bottom:48px;padding-bottom:48px;border-bottom:1px solid var(--border);}
    .blog-content{font-size:16.5px;line-height:1.82;color:var(--ink2);}
    .blog-content p{margin-bottom:28px;}
    .blog-content h2{font-family:var(--f-display);font-size:clamp(26px,3vw,40px);font-weight:400;letter-spacing:-.02em;line-height:1.1;margin:52px 0 20px;}
    .blog-content h3{font-size:18px;font-weight:600;margin:36px 0 14px;color:var(--ink);}
    .blog-content blockquote{border-left:2px solid var(--accent);padding:0 0 0 24px;margin:40px 0;font-family:var(--f-display);font-size:clamp(18px,2vw,26px);font-weight:300;font-style:italic;line-height:1.4;color:var(--ink2);}
    .blog-content ul,
    .blog-content ol{padding-left:24px;margin-bottom:28px;}
    .blog-content li{margin-bottom:8px;}
    .blog-content strong{color:var(--ink);font-weight:600;}
    .blog-content a{color:var(--accent);border-bottom:1px solid transparent;transition:border-color .2s;}
    .blog-content a:hover{border-color:var(--accent);}
    .blog-content img{width:100%;border-radius:6px;margin:40px 0;filter:saturate(.85);}

    /* EMPTY CONTENT STATE */
    .blog-coming-soon{padding:80px 0;text-align:center;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:48px 0;}
    .blog-coming-soon p{font-family:var(--f-display);font-size:28px;font-weight:300;font-style:italic;color:var(--muted);}

    /* FOOTER */
    .blog-footer-nav{padding:60px 56px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:24px;}
    .blog-footer-nav a{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);transition:color .2s,gap .2s var(--ease);}
    .blog-footer-nav a.next::after{content:'→';}
    .blog-footer-nav a.prev::before{content:'←';}
    .blog-footer-nav a:hover{color:var(--accent);}

    /* GRAIN */
    body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9990;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:200px 200px;}

    /* RESPONSIVE */
    @media(max-width:900px){
      nav,.blog-hero,.blog-body,.blog-footer-nav{padding-left:28px;padding-right:28px;}
    }
  </style>
</head>
<body>

<!-- LOADER -->
<div id="loader"><span class="loader-text">Loading…</span></div>

<!-- NAV -->
<nav>
  <a href="/" class="nav-logo">Yuvrajsinh Jadeja</a>
  <a href="/#writing" class="nav-back">Back to Writing</a>
</nav>

<!-- CONTENT -->
<div id="blog-content" style="display:none;">

  <div class="blog-hero">
    <p class="blog-type" id="blogType"></p>
    <h1 class="blog-title" id="blogTitle"></h1>
    <div class="blog-meta" id="blogMeta"></div>
  </div>

  <div class="blog-cover" id="blogCoverWrap">
    <img id="blogCoverImg" src="" alt="">
  </div>

  <div class="blog-body">
    <p class="blog-excerpt" id="blogExcerpt"></p>
    <div class="blog-content" id="blogBody"></div>
  </div>

  <div class="blog-footer-nav">
    <a href="/#writing" class="prev">All Writing</a>
    <a href="mailto:jadejayuvrajsinh10@gmail.com" class="next">Get in touch</a>
  </div>

</div>

<!-- ERROR -->
<div id="error-state">
  <h2>Article not found</h2>
  <p>This post might not be published yet.</p>
  <a href="/#writing" class="btn-back">← Back to Writing</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(async () => {
  const SUPA_URL = 'https://ftubenlcdaypxdbwfzji.supabase.co';
  const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ0dWJlbmxjZGF5cHhkYndmemppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNzk2MTcsImV4cCI6MjA5NDY1NTYxN30.HORvx75jAm186bGWCE9xMFU7xmpgkN5htaJqRGXX060';
  const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

  const slug   = location.pathname.replace(/\/?blog\/?/, '').replace(/^\/|\/$/g, '');
  const loader = document.getElementById('loader');

  if (!slug) { loader.style.display = 'none'; document.getElementById('error-state').style.display = 'block'; return; }

  const { data: post, error } = await sb
    .from('blog_posts')
    .select('*')
    .eq('slug', slug)
    .eq('published', true)
    .single();

  if (error || !post) {
    loader.style.display = 'none';
    document.getElementById('error-state').style.display = 'block';
    return;
  }

  document.title = `${post.title} — Yuvrajsinh Jadeja`;

  document.getElementById('blogType').textContent  = post.type || 'Thinking';
  document.getElementById('blogTitle').textContent = post.title;
  document.getElementById('blogExcerpt').textContent = post.excerpt || '';

  // meta
  const date = new Date(post.published_at).toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' });
  document.getElementById('blogMeta').innerHTML =
    `<span class="blog-meta-item">${date}</span>
     <span class="blog-meta-sep"></span>
     <span class="blog-meta-item">${post.read_time || '4 min read'}</span>`;

  // cover
  if (post.cover_image_url) {
    document.getElementById('blogCoverImg').src = post.cover_image_url;
    document.getElementById('blogCoverImg').alt = post.title;
  } else {
    document.getElementById('blogCoverWrap').style.display = 'none';
  }

  // body content
  const bodyEl = document.getElementById('blogBody');
  if (post.content) {
    // if content is HTML, render it; if plain text, wrap in paragraphs
    const isHTML = /<[a-z][\s\S]*>/i.test(post.content);
    if (isHTML) {
      bodyEl.innerHTML = post.content;
    } else {
      bodyEl.innerHTML = post.content.split('\n\n').map(p => `<p>${p.trim()}</p>`).join('');
    }
  } else {
    bodyEl.innerHTML = `<div class="blog-coming-soon"><p>Full article coming soon.</p></div>`;
  }

  // reveal
  loader.style.display = 'none';
  document.getElementById('blog-content').style.display = 'block';
  gsap.from('.blog-hero > *', { y:30, opacity:0, duration:.9, stagger:.12, ease:'expo.out', delay:.1 });
})();
</script>
</body>
</html>
