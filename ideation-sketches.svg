  <text x="787" y="197" font-family="'Courier New',monospace" font-size="22" fill="#4A6B4E" text-anchor="middle">✓</text>
  <text x="787" y="213" font-family="'Courier New',monospace" font-size="6.5" fill="#4A6B4E" text-anchor="middle" font-weight="700">Approved</text>
  <text x="787" y="223" font-family="'Courier New',monospace" font-size="5.5" fill="#6A9B6E" text-anchor="middle">Account live</text>
  <text x="787" y="243" font-family="'Courier New',monospace" font-size="6" fill="#4A6B4E" text-anchor="middle" font-weight="700">✓</text>

  <!-- ─────────────────────────────
       STICKY NOTE ANNOTATIONS
  ───────────────────────────────── -->

  <!-- Note 1: drop-off risk at docs -->
  <g transform="translate(440, 290)">
    <rect width="118" height="56" rx="2" fill="#FEF3C7" stroke="#F0D060" stroke-width="0.8" transform="rotate(-1.5)"/>
    <text x="10" y="18" font-family="'Courier New',monospace" font-size="7.5" fill="#92400E" font-weight="700">drop-off risk</text>
    <text x="10" y="30" font-family="'Courier New',monospace" font-size="6.5" fill="#92400E">unclear file format</text>
    <text x="10" y="40" font-family="'Courier New',monospace" font-size="6.5" fill="#92400E">requirements →</text>
    <text x="10" y="50" font-family="'Courier New',monospace" font-size="6.5" fill="#92400E">show examples!</text>
  </g>
  <!-- line from note to docs node -->
  <line x1="504" y1="226" x2="504" y2="290" stroke="#F0D060" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.7"/>

  <!-- Note 2: progress context -->
  <g transform="translate(148, 290)">
    <rect width="118" height="48" rx="2" fill="#DBEAFE" stroke="#93C5FD" stroke-width="0.8" transform="rotate(1.2)"/>
    <text x="10" y="16" font-family="'Courier New',monospace" font-size="7.5" fill="#1E3A5F" font-weight="700">progress bar</text>
    <text x="10" y="27" font-family="'Courier New',monospace" font-size="6.5" fill="#1E3A5F">users need to know</text>
    <text x="10" y="37" font-family="'Courier New',monospace" font-size="6.5" fill="#1E3A5F">how long this takes</text>
    <text x="10" y="47" font-family="'Courier New',monospace" font-size="6.5" fill="#1E3A5F">~4 min est.</text>
  </g>
  <line x1="203" y1="224" x2="203" y2="290" stroke="#93C5FD" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.7"/>

  <!-- Note 3: save & resume -->
  <g transform="translate(590, 290)">
    <rect width="120" height="48" rx="2" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="0.8" transform="rotate(0.8)"/>
    <text x="10" y="16" font-family="'Courier New',monospace" font-size="7.5" fill="#831843" font-weight="700">save &amp; resume</text>
    <text x="10" y="27" font-family="'Courier New',monospace" font-size="6.5" fill="#831843">user can't finish</text>
    <text x="10" y="37" font-family="'Courier New',monospace" font-size="6.5" fill="#831843">in one sitting →</text>
    <text x="10" y="47" font-family="'Courier New',monospace" font-size="6.5" fill="#831843">draft state needed</text>
  </g>
  <line x1="650" y1="224" x2="650" y2="290" stroke="#F9A8D4" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.7"/>

  <!-- ── HMW prompt at bottom ── -->
  <rect x="40" y="390" width="760" height="32" rx="3" fill="white" stroke="#DDD9D2" stroke-width="0.8"/>
  <text x="54" y="406" font-family="'Courier New',monospace" font-size="8" fill="#C94F1E" font-weight="700">HMW →</text>
  <text x="120" y="406" font-family="'Courier New',monospace" font-size="8" fill="#2A2520">reduce abandonment at the document upload step for first-time users unfamiliar with KYC requirements?</text>

  <!-- Estimated time bar -->
  <rect x="40" y="432" width="760" height="16" rx="2" fill="#EDEBE6"/>
  <rect x="40" y="432" width="100" height="16" rx="2" fill="#B8B3AC" opacity="0.4"/><!-- Landing+Creds -->
  <rect x="140" y="432" width="80" height="16" rx="0" fill="#B8B3AC" opacity="0.6"/><!-- Identity -->
  <rect x="220" y="432" width="80" height="16" rx="0" fill="#B8B3AC" opacity="0.4"/><!-- Address -->
  <rect x="300" y="432" width="120" height="16" rx="0" fill="#C94F1E" opacity="0.25"/><!-- Docs - long -->
  <rect x="420" y="432" width="100" height="16" rx="0" fill="#B8B3AC" opacity="0.5"/><!-- Selfie -->
  <rect x="520" y="432" width="80" height="16" rx="2" fill="#4A6B4E" opacity="0.3"/><!-- Review -->
  <text x="54" y="442" font-family="'Courier New',monospace" font-size="6" fill="#888">1–2 min</text>
  <text x="154" y="442" font-family="'Courier New',monospace" font-size="6" fill="#888">90s</text>
  <text x="234" y="442" font-family="'Courier New',monospace" font-size="6" fill="#888">60s</text>
  <text x="314" y="442" font-family="'Courier New',monospace" font-size="6" fill="#C94F1E" font-weight="700">2–4 min ⚠</text>
  <text x="430" y="442" font-family="'Courier New',monospace" font-size="6" fill="#888">45s</text>
  <text x="530" y="442" font-family="'Courier New',monospace" font-size="6" fill="#555">review</text>
  <text x="40" y="462" font-family="'Courier New',monospace" font-size="7" fill="#AAA">estimated time per step</text>

  <!-- Bottom meta -->
  <text x="420" y="488" font-family="'Courier New', monospace" font-size="8" fill="#C2BDB6" text-anchor="middle">Week 2 · Research Synthesis → Flow Mapping · Before / After HMW framing</text>
  <line x1="40" y1="478" x2="800" y2="478" stroke="#D8D4CE" stroke-width="0.5"/>
</svg>
