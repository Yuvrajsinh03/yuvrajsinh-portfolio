  <text x="651" y="370" font-family="'Courier New',monospace" font-size="7" fill="#C94F1E" text-anchor="middle">for v1 scope</text>

  <!-- Divider lines between phones -->
  <line x1="215" y1="80" x2="350" y2="80" stroke="#D0CCC5" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="505" y1="80" x2="638" y2="80" stroke="#D0CCC5" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- Bottom meta -->
  <text x="420" y="472" font-family="'Courier New',monospace" font-size="8" fill="#C2BDB6" text-anchor="middle">Week 2 · Discovery Sprint · Sketched in Miro</text>
  <line x1="40" y1="458" x2="800" y2="458" stroke="#D8D4CE" stroke-width="0.5"/>
</svg>
