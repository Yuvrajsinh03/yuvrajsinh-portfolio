  <circle cx="429" cy="114" r="5" fill="white" stroke="#CCC" stroke-width="0.8"/>
  <text x="429" y="117" font-family="'Courier New',monospace" font-size="5.5" fill="#BBB" text-anchor="middle">3</text>
  <line x1="434" y1="114" x2="445" y2="114" stroke="#CCC" stroke-width="0.8"/>
  <circle cx="451" cy="114" r="5" fill="white" stroke="#CCC" stroke-width="0.8"/>
  <text x="451" y="117" font-family="'Courier New',monospace" font-size="5.5" fill="#BBB" text-anchor="middle">4</text>
  <text x="385" y="125" font-family="'Courier New',monospace" font-size="4.5" fill="#2A2520" text-anchor="middle">Identity</text>
  <text x="407" y="125" font-family="'Courier New',monospace" font-size="4.5" fill="#AAA" text-anchor="middle">Address</text>
  <text x="429" y="125" font-family="'Courier New',monospace" font-size="4.5" fill="#AAA" text-anchor="middle">Docs</text>
  <text x="451" y="125" font-family="'Courier New',monospace" font-size="4.5" fill="#AAA" text-anchor="middle">Review</text>

