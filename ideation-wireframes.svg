  <rect x="378" y="176" width="88" height="15" rx="2.5" fill="white" stroke="#C8C4BE" stroke-width="0.8"/>
  <text x="386" y="185" font-family="'Courier New',monospace" font-size="5.5" fill="#BBBBBB">Date of birth</text>

  <rect x="378" y="194" width="88" height="15" rx="2.5" fill="white" stroke="#C8C4BE" stroke-width="0.8"/>
  <text x="386" y="203" font-family="'Courier New',monospace" font-size="5.5" fill="#BBBBBB">Nationality</text>

  <!-- CTA -->
  <rect x="378" y="218" width="88" height="17" rx="3" fill="#2A2520"/>
  <text x="422" y="229" font-family="'Courier New',monospace" font-size="6" fill="#F7F4EF" text-anchor="middle" font-weight="700">Next: Address →</text>

  <!-- Label -->
  <text x="422" y="312" font-family="'Courier New',monospace" font-size="10" fill="#2A2520" text-anchor="middle" font-weight="700">V2 — Progress-Led</text>
  <text x="422" y="326" font-family="'Courier New',monospace" font-size="7.5" fill="#4A6B4E" text-anchor="middle">Visible journey map ✓</text>

  <!-- SELECTED badge -->
  <rect x="370" y="338" width="104" height="16" rx="3" fill="#2A2520"/>
  <text x="422" y="349" font-family="'Courier New',monospace" font-size="6.5" fill="#F7F4EF" text-anchor="middle" letter-spacing="1.5">SELECTED</text>

  <!-- Annotation: good -->
  <text x="498" y="108" font-family="'Courier New',monospace" font-size="7" fill="#4A6B4E">user knows</text>
  <text x="498" y="118" font-family="'Courier New',monospace" font-size="7" fill="#4A6B4E">where they are</text>
  <line x1="490" y1="112" x2="498" y2="112" stroke="#4A6B4E" stroke-width="0.8" stroke-dasharray="3,2" marker-end="url(#arrowGreen)"/>

  <!-- ─────────────────────────────
       PHONE 3 — V3: Chunked Accordion
  ───────────────────────────────── -->
  <rect x="650" y="68" width="116" height="222" rx="14" fill="#2A2520" opacity="0.08" transform="translate(2,3)"/>
  <rect x="650" y="68" width="116" height="222" rx="14" fill="#EDEBE6" stroke="#2A2520" stroke-width="1.8"/>
  <rect x="656" y="80" width="104" height="202" rx="8" fill="#F2F0EB"/>
  <rect x="692" y="80" width="32" height="6" rx="3" fill="#2A2520" opacity="0.2"/>

