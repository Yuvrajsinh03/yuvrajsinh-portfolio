  <rect x="656" y="131" width="104" height="72" fill="white" stroke="#2A2520" stroke-width="1"/>
  <text x="664" y="142" font-family="'Courier New',monospace" font-size="6.5" fill="#2A2520" font-weight="700">Address</text>
  <text x="750" y="142" font-family="'Courier New',monospace" font-size="9" fill="#2A2520" text-anchor="middle">∨</text>
  <rect x="664" y="148" width="84" height="11" rx="2" fill="#F2F0EB" stroke="#C8C4BE" stroke-width="0.7"/>
  <text x="670" y="156" font-family="'Courier New',monospace" font-size="5.5" fill="#BBBBBB">Street address</text>
  <rect x="664" y="162" width="40" height="11" rx="2" fill="#F2F0EB" stroke="#C8C4BE" stroke-width="0.7"/>
  <text x="670" y="170" font-family="'Courier New',monospace" font-size="5.5" fill="#BBBBBB">Postcode</text>
  <rect x="707" y="162" width="41" height="11" rx="2" fill="#F2F0EB" stroke="#C8C4BE" stroke-width="0.7"/>
  <text x="713" y="170" font-family="'Courier New',monospace" font-size="5.5" fill="#BBBBBB">City</text>
  <rect x="664" y="176" width="84" height="11" rx="2" fill="#F2F0EB" stroke="#C8C4BE" stroke-width="0.7"/>
  <text x="670" y="184" font-family="'Courier New',monospace" font-size="5.5" fill="#BBBBBB">Country</text>

  <!-- Row 3: Documents — collapsed -->
  <rect x="656" y="204" width="104" height="22" fill="#E4E0D8" stroke="#CCC8C2" stroke-width="0.5"/>
  <text x="664" y="218" font-family="'Courier New',monospace" font-size="6.5" fill="#AAA">Documents</text>
  <text x="750" y="218" font-family="'Courier New',monospace" font-size="9" fill="#CCC" text-anchor="middle">›</text>

  <!-- CTA -->
  <rect x="656" y="238" width="104" height="16" rx="3" fill="#C8C4BE"/>
  <text x="708" y="248" font-family="'Courier New',monospace" font-size="6" fill="#888" text-anchor="middle">Review &amp; Submit</text>

  <!-- V3 Label -->
