  <rect x="378" y="138" width="50" height="6" rx="1.5" fill="#B8B3AC"/>
  <rect x="378" y="147" width="88" height="4.5" rx="1" fill="#CCC8C2"/>

  <!-- Form fields -->
  <rect x="378" y="158" width="88" height="15" rx="2.5" fill="white" stroke="#C8C4BE" stroke-width="0.8"/>
