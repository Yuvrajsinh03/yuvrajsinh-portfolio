  <rect x="656" y="104" width="104" height="26" fill="#E4E0D8" stroke="#CCC8C2" stroke-width="0.5"/>
  <text x="664" y="115" font-family="'Courier New',monospace" font-size="6.5" fill="#2A2520" font-weight="700">Identity</text>
  <text x="664" y="124" font-family="'Courier New',monospace" font-size="5.5" fill="#AAA">John M. · 12 Mar 1988</text>
  <text x="750" y="119" font-family="'Courier New',monospace" font-size="9" fill="#4A6B4E" text-anchor="middle">✓</text>

