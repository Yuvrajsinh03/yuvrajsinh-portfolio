  <circle cx="385" cy="114" r="5.5" fill="#2A2520"/>
  <text x="385" y="117" font-family="'Courier New',monospace" font-size="5.5" fill="white" text-anchor="middle" font-weight="700">1</text>
  <line x1="390.5" y1="114" x2="401.5" y2="114" stroke="#2A2520" stroke-width="1.2"/>
  <circle cx="407" cy="114" r="5" fill="white" stroke="#2A2520" stroke-width="1.2"/>
  <text x="407" y="117" font-family="'Courier New',monospace" font-size="5.5" fill="#888" text-anchor="middle">2</text>
