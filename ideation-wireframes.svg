<svg viewBox="0 0 840 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="0.8" fill="#C2BDB6" opacity="0.55"/>
    </pattern>
    <!-- slight paper texture via filter -->
    <filter id="paper" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
    <marker id="arrowOrange" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#C94F1E" opacity="0.7"/>
    </marker>
    <marker id="arrowGreen" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4A6B4E" opacity="0.8"/>
    </marker>
    <marker id="arrowGray" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#888" opacity="0.6"/>
    </marker>
  </defs>

  <!-- Paper background -->
  <rect width="840" height="520" fill="#F7F4EF"/>
  <rect width="840" height="520" fill="url(#dots)"/>

  <!-- Top label -->
  <text x="40" y="42" font-family="'Courier New', monospace" font-size="9" letter-spacing="2.5" fill="#AAA" font-weight="700">IDEATION — LAYOUT EXPLORATION</text>
  <line x1="40" y1="50" x2="800" y2="50" stroke="#D8D4CE" stroke-width="0.6"/>

  <!-- ─────────────────────────────
       PHONE 1 — V1: Linear
  ───────────────────────────────── -->
  <!-- Phone shell -->
  <rect x="76" y="68" width="116" height="222" rx="14" fill="#2A2520" opacity="0.08" transform="translate(2,3)"/>
  <rect x="76" y="68" width="116" height="222" rx="14" fill="#EDEBE6" stroke="#2A2520" stroke-width="1.8"/>
  <!-- Screen area -->
  <rect x="82" y="80" width="104" height="202" rx="8" fill="#F2F0EB"/>
  <!-- Notch -->
  <rect x="118" y="80" width="32" height="6" rx="3" fill="#2A2520" opacity="0.2"/>

  <!-- Nav bar -->
  <rect x="82" y="86" width="104" height="18" rx="0" fill="#DDD9D2"/>
  <rect x="89" y="92" width="10" height="1.5" fill="#888"/>
  <rect x="89" y="95" width="10" height="1.5" fill="#888"/>
  <rect x="89" y="98" width="7" height="1.5" fill="#888"/>
  <text x="134" y="97" font-family="'Courier New',monospace" font-size="6" fill="#666" text-anchor="middle">KYC Onboarding</text>

  <!-- No progress indicator — just blank -->
  <rect x="82" y="104" width="104" height="6" fill="#E8E4DE"/>
  <text x="134" y="118" font-family="'Courier New',monospace" font-size="6.5" fill="#AAA" text-anchor="middle">STEP 1 OF 5</text>

  <!-- Heading blocks -->
  <rect x="92" y="126" width="52" height="6" rx="1.5" fill="#B8B3AC"/>
  <rect x="92" y="135" width="84" height="4.5" rx="1" fill="#CCC8C2"/>
  <rect x="92" y="141" width="68" height="4.5" rx="1" fill="#CCC8C2"/>

  <!-- Form fields -->
  <rect x="92" y="154" width="84" height="15" rx="2.5" fill="white" stroke="#C8C4BE" stroke-width="0.8"/>
  <text x="100" y="163" font-family="'Courier New',monospace" font-size="5.5" fill="#BBBBBB">Full legal name</text>

  <rect x="92" y="172" width="84" height="15" rx="2.5" fill="white" stroke="#C8C4BE" stroke-width="0.8"/>
  <text x="100" y="181" font-family="'Courier New',monospace" font-size="5.5" fill="#BBBBBB">Date of birth</text>

  <rect x="92" y="190" width="84" height="15" rx="2.5" fill="white" stroke="#C8C4BE" stroke-width="0.8"/>
  <text x="100" y="199" font-family="'Courier New',monospace" font-size="5.5" fill="#BBBBBB">Nationality</text>

  <!-- CTA -->
  <rect x="92" y="214" width="84" height="16" rx="3" fill="#2A2520"/>
  <text x="134" y="224" font-family="'Courier New',monospace" font-size="6" fill="#F7F4EF" text-anchor="middle" font-weight="700">Continue →</text>

  <!-- V1 Label -->
  <text x="134" y="312" font-family="'Courier New',monospace" font-size="10" fill="#2A2520" text-anchor="middle" font-weight="700">V1 — Linear</text>
  <text x="134" y="326" font-family="'Courier New',monospace" font-size="7.5" fill="#999" text-anchor="middle">No progress context</text>

  <!-- Annotation: problem -->
  <text x="20" y="118" font-family="'Courier New',monospace" font-size="7" fill="#C94F1E">where am I?</text>
  <line x1="58" y1="116" x2="82" y2="112" stroke="#C94F1E" stroke-width="0.8" stroke-dasharray="3,2" marker-end="url(#arrowOrange)"/>

  <!-- ─────────────────────────────
       PHONE 2 — V2: Progress-Led  (SELECTED)
  ───────────────────────────────── -->
  <rect x="362" y="65" width="120" height="228" rx="14" fill="#2A2520" opacity="0.12" transform="translate(2,3)"/>
  <rect x="362" y="65" width="120" height="228" rx="14" fill="#EDEBE6" stroke="#2A2520" stroke-width="2.2"/>
  <rect x="368" y="77" width="108" height="208" rx="8" fill="#F2F0EB"/>
  <rect x="404" y="77" width="36" height="6" rx="3" fill="#2A2520" opacity="0.2"/>

  <!-- Nav bar -->
  <rect x="368" y="83" width="108" height="18" rx="0" fill="#DDD9D2"/>
  <text x="422" y="94" font-family="'Courier New',monospace" font-size="6" fill="#555" text-anchor="middle">Identity Verification</text>

  <!-- Progress stepper -->
  <rect x="368" y="101" width="108" height="26" fill="#E4E0D8"/>
