<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case Study — Yuvrajsinh Jadeja</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    :root{
      --bg:#F5F0E8;--bg2:#EDE8DC;--bg3:#E3DDD0;
      --ink:#1A1208;--ink2:#3D3629;--muted:#8A7E6E;
      --accent:#D94F1E;--border:rgba(26,18,8,.10);
      --f-display:'Cormorant Garamond',Georgia,serif;
      --f-body:'DM Sans',system-ui,sans-serif;
      --ease:cubic-bezier(0.16,1,0.3,1);
    }
    html{scroll-behavior:smooth;}
    body{background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.6;overflow-x:hidden;}
    a{color:inherit;text-decoration:none;}
    img{display:block;max-width:100%;}

    /* NAV */
    nav{position:fixed;top:0;left:0;right:0;z-index:200;padding:18px 56px;display:flex;justify-content:space-between;align-items:center;background:rgba(245,240,232,.92);backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid var(--border);}
    .nav-logo{font-family:var(--f-display);font-size:18px;font-weight:600;letter-spacing:-.01em;}
    .nav-back{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);transition:color .2s,gap .2s var(--ease);}
    .nav-back:hover{color:var(--accent);gap:14px;}
    .nav-back::before{content:'←';}

    /* LOADING STATE */
    #loader{position:fixed;inset:0;background:var(--ink);z-index:9999;display:flex;align-items:center;justify-content:center;transition:opacity .6s var(--ease);}
    #loader.hidden{opacity:0;pointer-events:none;}
    .loader-text{font-family:var(--f-display);font-size:clamp(32px,6vw,72px);font-weight:300;font-style:italic;color:var(--bg);letter-spacing:-.04em;}

    /* ERROR STATE */
    #error-state{display:none;padding:160px 56px;text-align:center;}
    #error-state h2{font-family:var(--f-display);font-size:48px;font-weight:300;margin-bottom:16px;}
    #error-state p{color:var(--muted);margin-bottom:32px;}
    .btn-back{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border:1.5px solid var(--ink);border-radius:100px;font-size:12px;font-weight:600;letter-spacing:.07em;transition:background .2s,color .2s,border-color .2s;}
    .btn-back:hover{background:var(--accent);border-color:var(--accent);color:#fff;}

    /* HERO */
    .cs-hero{min-height:100svh;background:var(--ink);display:flex;flex-direction:column;justify-content:flex-end;padding:120px 56px 80px;position:relative;overflow:hidden;}
    .cs-hero-bg{position:absolute;inset:0;z-index:0;}
    .cs-hero-bg img{width:100%;height:100%;object-fit:cover;object-position:top;filter:saturate(.5) brightness(.35);}
    .cs-hero-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(26,18,8,.98) 0%,rgba(26,18,8,.72) 50%,rgba(26,18,8,.3) 100%);}
    .cs-hero-content{position:relative;z-index:2;max-width:860px;}
    .cs-cat{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:24px;display:flex;align-items:center;gap:10px;}
    .cs-cat::before{content:'';display:block;width:20px;height:1px;background:var(--accent);}
    .cs-title{font-family:var(--f-display);font-size:clamp(48px,7vw,108px);font-weight:300;line-height:.93;letter-spacing:-.04em;color:var(--bg);margin-bottom:36px;}
    .cs-meta-row{display:flex;gap:48px;flex-wrap:wrap;}
    .cs-meta-item .label{font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(245,240,232,.3);margin-bottom:5px;}
    .cs-meta-item .val{font-size:14px;font-weight:500;color:rgba(245,240,232,.75);}

    /* METRICS */
    .cs-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:3px;background:var(--border);border-top:1px solid var(--border);}
    .cs-metric{padding:40px 36px;background:var(--bg);}
    .cs-metric-val{font-family:var(--f-display);font-size:clamp(40px,5vw,72px);font-weight:300;letter-spacing:-.04em;margin-bottom:8px;color:var(--ink);}
    .cs-metric-label{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}

    /* DESCRIPTION */
    .cs-body{padding:100px 56px;max-width:1100px;margin:0 auto;}
    .cs-desc{font-family:var(--f-display);font-size:clamp(24px,2.8vw,40px);font-weight:300;line-height:1.3;letter-spacing:-.02em;margin-bottom:60px;border-bottom:1px solid var(--border);padding-bottom:60px;}
    .cs-desc em{font-style:italic;color:var(--accent);}
    .cs-outcomes-label{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:20px;}
    .cs-outcomes-text{font-size:16px;line-height:1.78;color:var(--ink2);max-width:720px;margin-bottom:60px;}

    /* IMAGES GRID */
    .cs-images{padding:0 56px 100px;}
    .cs-images-grid{display:flex;flex-direction:column;gap:6px;}
    .cs-img-item{border-radius:6px;overflow:hidden;background:var(--bg2);}
    .cs-img-item img{width:100%;object-fit:cover;transition:transform .8s var(--ease);}
    .cs-img-item:hover img{transform:scale(1.02);}
    .cs-img-item.full{width:100%;}
    .cs-img-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;}

    /* TAGS */
    .cs-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:80px;}
    .cs-tag{padding:7px 16px;border:1px solid var(--border);border-radius:100px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);}

    /* FOOTER NAV */
    .cs-footer-nav{padding:60px 56px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:24px;}
    .cs-footer-nav a{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);transition:color .2s,gap .2s var(--ease);}
    .cs-footer-nav a.next::after{content:'→';}
    .cs-footer-nav a.prev::before{content:'←';}
    .cs-footer-nav a:hover{color:var(--accent);}

    /* GRAIN */
    body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9990;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:200px 200px;}

    /* RESPONSIVE */
    @media(max-width:900px){
      nav,.cs-hero,.cs-body,.cs-images,.cs-footer-nav{padding-left:28px;padding-right:28px;}
      .cs-meta-row{gap:28px;}
      .cs-img-row{grid-template-columns:1fr;}
    }
    @media(max-width:600px){
      .cs-metrics{grid-template-columns:1fr 1fr;}
    }
  </style>
</head>
<body>

<!-- LOADER -->
<div id="loader"><span class="loader-text">Loading…</span></div>

<!-- NAV -->
<nav>
  <a href="/" class="nav-logo">Yuvrajsinh Jadeja</a>
  <a href="/#work" class="nav-back">Back to Work</a>
</nav>

<!-- CONTENT (injected by JS) -->
<div id="cs-content" style="display:none;padding-top:0;">

  <!-- hero -->
  <div class="cs-hero" id="csHero">
    <div class="cs-hero-bg"><img id="csCoverImg" src="" alt=""></div>
    <div class="cs-hero-content">
      <p class="cs-cat" id="csCat"></p>
      <h1 class="cs-title" id="csTitle"></h1>
      <div class="cs-meta-row" id="csMetaRow"></div>
    </div>
  </div>

  <!-- metrics -->
  <div class="cs-metrics" id="csMetrics"></div>

  <!-- body -->
  <div class="cs-body">
    <p class="cs-desc" id="csDesc"></p>
    <p class="cs-outcomes-label">Outcomes</p>
    <p class="cs-outcomes-text" id="csOutcomes"></p>
    <div class="cs-tags" id="csTags"></div>
  </div>

  <!-- image gallery -->
  <div class="cs-images" id="csImages" style="display:none;">
    <div class="cs-images-grid" id="csImagesGrid"></div>
  </div>

  <!-- footer nav -->
  <div class="cs-footer-nav">
    <a href="/#work" class="prev">All Work</a>
    <a href="mailto:jadejayuvrajsinh10@gmail.com" class="next">Discuss this project</a>
  </div>

</div>

<!-- ERROR STATE -->
<div id="error-state">
  <h2>Case study not found</h2>
  <p>This project might not be published yet.</p>
  <a href="/#work" class="btn-back">← Back to Work</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(async () => {
  const SUPA_URL  = 'https://ftubenlcdaypxdbwfzji.supabase.co';
  const SUPA_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ0dWJlbmxjZGF5cHhkYndmemppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNzk2MTcsImV4cCI6MjA5NDY1NTYxN30.HORvx75jAm186bGWCE9xMFU7xmpgkN5htaJqRGXX060';
  const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

  // read slug from URL  →  /case-study/my-slug
  const slug = location.pathname.replace(/\/?case-study\/?/, '').replace(/^\/|\/$/g, '');

  const loader = document.getElementById('loader');
  const hide = (el) => { el.style.display = 'none'; };
  const show = (el, d='block') => { el.style.display = d; };

  if (!slug) { hide(loader); show(document.getElementById('error-state')); return; }

  const { data: cs, error } = await sb
    .from('case_studies')
    .select('*')
    .eq('slug', slug)
    .eq('published', true)
    .single();

  if (error || !cs) {
    hide(loader);
    show(document.getElementById('error-state'));
    return;
  }

  // ── populate ──
  document.title = `${cs.title} — Yuvrajsinh Jadeja`;

  document.getElementById('csCoverImg').src = cs.cover_image_url || '';
  document.getElementById('csCoverImg').alt = cs.title;
  document.getElementById('csCat').textContent   = cs.category || '';
  document.getElementById('csTitle').textContent = cs.title;
  document.getElementById('csDesc').innerHTML    = cs.description || '';
  document.getElementById('csOutcomes').textContent = cs.outcomes || '';

  // meta row
  const metaFields = [
    { label:'Role',  val: cs.role },
    { label:'Year',  val: cs.year },
    { label:'Location', val: cs.location },
  ].filter(f => f.val);
  document.getElementById('csMetaRow').innerHTML = metaFields.map(f =>
    `<div class="cs-meta-item"><div class="label">${f.label}</div><div class="val">${f.val}</div></div>`
  ).join('');

  // metrics
  const metrics = Array.isArray(cs.metrics) ? cs.metrics : JSON.parse(cs.metrics || '[]');
  document.getElementById('csMetrics').innerHTML = metrics.map(m =>
    `<div class="cs-metric"><div class="cs-metric-val">${m.value}</div><div class="cs-metric-label">${m.label}</div></div>`
  ).join('');

  // tags
  const tags = Array.isArray(cs.tags) ? cs.tags : JSON.parse(cs.tags || '[]');
  document.getElementById('csTags').innerHTML = tags.map(t =>
    `<span class="cs-tag">${t}</span>`
  ).join('');

  // body images
  const imgs = Array.isArray(cs.body_images) ? cs.body_images : JSON.parse(cs.body_images || '[]');
  if (imgs.length) {
    const grid = document.getElementById('csImagesGrid');
    // first image full-width, rest in pairs
    let html = `<div class="cs-img-item full"><img src="${imgs[0]}" alt="${cs.title} — screen 1" loading="lazy"></div>`;
    for (let i = 1; i < imgs.length; i += 2) {
      if (imgs[i+1]) {
        html += `<div class="cs-img-row">
          <div class="cs-img-item"><img src="${imgs[i]}" alt="${cs.title} — screen ${i+1}" loading="lazy"></div>
          <div class="cs-img-item"><img src="${imgs[i+1]}" alt="${cs.title} — screen ${i+2}" loading="lazy"></div>
        </div>`;
      } else {
        html += `<div class="cs-img-item full"><img src="${imgs[i]}" alt="${cs.title} — screen ${i+1}" loading="lazy"></div>`;
      }
    }
    grid.innerHTML = html;
    show(document.getElementById('csImages'));
  }

  // reveal
  hide(loader);
  show(document.getElementById('cs-content'));
  gsap.from('#csHero .cs-hero-content > *', { y:40, opacity:0, duration:1, stagger:0.15, ease:'expo.out', delay:0.1 });
})();
</script>
</body>
</html>
